<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MessyMaze - 팩맨 스타일 게임</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", "Noto Sans KR", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #06070f;
        color: #f5f7ff;
      }

      .game-shell {
        width: min(92vw, 540px);
      }

      .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.6rem;
        font-size: 0.95rem;
      }

      canvas {
        width: 100%;
        image-rendering: pixelated;
        border: 2px solid #334;
        background: #000;
      }

      .hint {
        margin-top: 0.6rem;
        opacity: 0.85;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <div class="hud">
        <strong>점수: <span id="score">0</span></strong>
        <span id="state">←↑↓→ 이동</span>
      </div>
      <canvas id="game" width="504" height="504" aria-label="팩맨 스타일 아케이드 게임"></canvas>
      <p class="hint">모든 점을 먹으면 승리! 유령과 부딪히면 게임 오버입니다. R 키로 재시작.</p>
    </main>

    <script>
      const TILE = 24;
      const MAP = [
        "#####################",
        "#........#........G.#",
        "#.###.##.#.##.###.###",
        "#o###.##.#.##.###...#",
        "#...................#",
        "#.###.#.#####.#.###.#",
        "#.....#...P...#.....#",
        "#####.###.#.###.#####",
        "#.........#.........#",
        "#.###.#####.#####.###",
        "#...#...........#...#",
        "###.###.##.##.###.###",
        "#G........#........G#",
        "#####################",
      ];

      const rows = MAP.length;
      const cols = MAP[0].length;
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const stateEl = document.getElementById("state");

      const dirs = {
        ArrowLeft: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 },
        ArrowUp: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 },
      };

      let world;
      let player;
      let ghosts;
      let score;
      let dotsLeft;
      let running;
      let pendingDir;
      let lastTick = 0;

      function reset() {
        world = MAP.map((line) => line.split(""));
        ghosts = [];
        dotsLeft = 0;
        score = 0;
        pendingDir = null;
        running = true;

        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            const c = world[y][x];
            if (c === "P") {
              player = { x, y, dir: { x: 0, y: 0 } };
              world[y][x] = " ";
            } else if (c === "G") {
              ghosts.push({ x, y, dir: randomDir() });
              world[y][x] = " ";
            } else if (c === "." || c === "o") {
              dotsLeft++;
            }
          }
        }

        scoreEl.textContent = "0";
        stateEl.textContent = "←↑↓→ 이동";
      }

      function isWall(x, y) {
        return world[y]?.[x] === "#";
      }

      function canMove(entity, dir) {
        if (!dir) return false;
        const nx = entity.x + dir.x;
        const ny = entity.y + dir.y;
        return !isWall(nx, ny);
      }

      function eatAt(x, y) {
        const c = world[y][x];
        if (c === ".") {
          score += 10;
          dotsLeft--;
          world[y][x] = " ";
        } else if (c === "o") {
          score += 50;
          dotsLeft--;
          world[y][x] = " ";
        }
        scoreEl.textContent = String(score);
      }

      function randomDir() {
        const values = Object.values(dirs);
        return values[(Math.random() * values.length) | 0];
      }

      function movePlayer() {
        if (canMove(player, pendingDir)) {
          player.dir = pendingDir;
          pendingDir = null;
        }
        if (canMove(player, player.dir)) {
          player.x += player.dir.x;
          player.y += player.dir.y;
          eatAt(player.x, player.y);
        }
      }

      function moveGhosts() {
        for (const ghost of ghosts) {
          const options = Object.values(dirs).filter((d) => canMove(ghost, d));
          const continueDir = options.find((d) => d.x === ghost.dir.x && d.y === ghost.dir.y);
          if (!continueDir || Math.random() < 0.35) {
            ghost.dir = options[(Math.random() * options.length) | 0] ?? { x: 0, y: 0 };
          }
          if (canMove(ghost, ghost.dir)) {
            ghost.x += ghost.dir.x;
            ghost.y += ghost.dir.y;
          }
        }
      }

      function collides() {
        return ghosts.some((g) => g.x === player.x && g.y === player.y);
      }

      function finish(text) {
        running = false;
        stateEl.textContent = text;
      }

      function tick(timestamp) {
        if (!lastTick) lastTick = timestamp;
        const elapsed = timestamp - lastTick;
        if (elapsed >= 120) {
          lastTick = timestamp;
          if (running) {
            movePlayer();
            moveGhosts();
            if (collides()) finish("게임 오버! R 키로 재시작");
            else if (dotsLeft <= 0) finish("클리어! R 키로 재시작");
          }
          draw();
        }
        requestAnimationFrame(tick);
      }

      function drawCell(x, y, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            const c = world[y][x];
            if (c === "#") {
              drawCell(x, y, "#1e4ccc");
              continue;
            }

            drawCell(x, y, "#000");
            if (c === "." || c === "o") {
              ctx.beginPath();
              ctx.fillStyle = c === "o" ? "#f9f871" : "#f5f5f5";
              const r = c === "o" ? 5 : 2;
              ctx.arc(x * TILE + TILE / 2, y * TILE + TILE / 2, r, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }

        ctx.fillStyle = "#ffeb3b";
        ctx.beginPath();
        ctx.arc(player.x * TILE + TILE / 2, player.y * TILE + TILE / 2, TILE * 0.4, 0.2, Math.PI * 1.8);
        ctx.lineTo(player.x * TILE + TILE / 2, player.y * TILE + TILE / 2);
        ctx.fill();

        for (const ghost of ghosts) {
          ctx.fillStyle = "#ff4f7b";
          ctx.beginPath();
          ctx.arc(ghost.x * TILE + TILE / 2, ghost.y * TILE + TILE / 2, TILE * 0.38, Math.PI, 0);
          ctx.lineTo(ghost.x * TILE + TILE * 0.88, ghost.y * TILE + TILE * 0.88);
          ctx.lineTo(ghost.x * TILE + TILE * 0.12, ghost.y * TILE + TILE * 0.88);
          ctx.closePath();
          ctx.fill();
        }
      }

      window.addEventListener("keydown", (event) => {
        if (event.key in dirs) {
          pendingDir = dirs[event.key];
          event.preventDefault();
        }
        if (event.key.toLowerCase() === "r") {
          reset();
          draw();
        }
      });

      reset();
      draw();
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
